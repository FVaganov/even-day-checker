name: CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: npm install
      # Выводим сообщение после установки зависимостей
      env:
        ACTIONS_STEP_DEBUG: true
    
    - name: Run tests
      run: npm test
      # Выводим сообщение после тестов
      env:
        ACTIONS_STEP_DEBUG: true
    
    - name: Completion message
      run: |
        echo "=========================================="
        echo "🚀 Все задачи выполнены успешно!"
        echo "🕒 Работа завершена в $(date)"
        echo "=========================================="
      # Всегда выполняется, даже если предыдущие шаги завершились с ошибкой
      if: always()